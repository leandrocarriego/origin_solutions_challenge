# Local development. One command from clone to running.
name: origin-acciones

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: origin
      POSTGRES_PASSWORD: origin
      POSTGRES_DB: origin
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U origin -d origin"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://origin:origin@db:5432/origin
      CORS_ORIGINS: '["http://localhost:5173"]'
      VERSION: dev
      # Empty unless `make setup` was given a DSN: with none, no events and no network.
      SENTRY_DSN: ${SENTRY_DSN:-}
      MARKET_DATA_API_KEY: ${TWELVEDATA_API_KEY:-}
      # A known development value, so a fresh clone can `make up` and log in. It is in the
      # repository on purpose and it is the same bargain the demo passwords of seed.py already
      # take: worthless because everyone has it, and confined to this file. Production is the
      # environment that matters, and there it is `${JWT_SECRET}` with no default at all --
      # compose refuses to start rather than sign with something guessable.
      # Override it here too by putting JWT_SECRET in .env; the command is in .env.example.
      JWT_SECRET: ${JWT_SECRET:-local-development-signing-key-not-a-secret}
      # The fake provider locally, so `make up` reaches no network and spends none of the 800
      # daily requests. `make setup` writes "twelvedata" here when it is handed a key, which is
      # the only thing that separates simulated series from real ones: same application, same
      # code path, a different implementation behind the same interface (ADR-006).
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-fake}
      # The entrypoint runs `alembic upgrade head` in every environment. Here it also loads the
      # demo dataset, because without data there is nothing to develop against. The
      # seed is idempotent: it runs on every `make up`.
      SEED_ON_START: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  # --- Observability ----------------------------------------------------------------------------
  # The same services production runs, with the hardening that only makes sense there left out:
  # no sub-path, no traefik labels, no memory limits, and a password everyone knows.

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
      - --storage.tsdb.retention.size=256MB
      # So `make load` can write its results here and they land next to the application's own
      # metrics: the run and what the run cost, on the same time axis and in the same tool.
      # Local only -- production scrapes, it does not receive, and an open write endpoint there
      # would be somewhere to inject metrics from.
      - --web.enable-remote-write-receiver
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:13.2.1
    environment:
      # The same credentials as the demo user of the application, so the README hands out one
      # pair and not two. Grafana only reads these when it creates its database: renaming the
      # admin of an existing volume is not something an environment variable can do.
      GF_SECURITY_ADMIN_USER: juan@demo.com
      GF_SECURITY_ADMIN_PASSWORD: Demo1234*
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki

  # Logs, so a spike and the lines that explain it share a pane. Explore -> Loki, or
  # `{service="backend"} | json` in a panel.
  loki:
    image: grafana/loki:3.7.7
    command: ["-config.file=/etc/loki/loki.yml"]
    user: "10001:10001"
    volumes:
      - ./infra/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"

  # Alloy tails this project's containers and pushes what it reads to Loki. `docker compose logs`
  # keeps working: the container still writes its own json file and Alloy follows it.
  alloy:
    image: grafana/alloy:v1.19.2
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      # Which containers are ours. The local project is not named like the deployed one, and a
      # filter matching the wrong name keeps nothing and says nothing.
      COMPOSE_PROJECT: origin-acciones
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
      - socket-proxy

  # The Docker socket is root on the host, and Alloy only needs to list containers and read their
  # output. The proxy is what makes that difference real: GET on /containers and nothing else.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    environment:
      CONTAINERS: "1"
      # Alloy reads /networks too: without it the discovery refuses the whole refresh with a 403.
      NETWORKS: "1"
      POST: "0"
      ALLOW_START: "0"
      ALLOW_STOP: "0"
      ALLOW_RESTARTS: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  db_data:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:
