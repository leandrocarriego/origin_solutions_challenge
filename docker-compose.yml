# Local development. One command from clone to running.
name: origin-acciones

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: origin
      POSTGRES_PASSWORD: origin
      POSTGRES_DB: origin
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U origin -d origin"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://origin:origin@db:5432/origin
      CORS_ORIGINS: '["http://localhost:5173"]'
      VERSION: dev
      # Empty on purpose: no events and no network while developing.
      SENTRY_DSN: ""
      MARKET_DATA_API_KEY: ${TWELVEDATA_API_KEY:-}
      # A known development value, so a fresh clone can `make up` and log in. It is in the
      # repository on purpose and it is the same bargain the demo passwords of seed.py already
      # take: worthless because everyone has it, and confined to this file. Production is the
      # environment that matters, and there it is `${JWT_SECRET}` with no default at all --
      # compose refuses to start rather than sign with something guessable.
      # Override it here too by putting JWT_SECRET in .env; the command is in .env.example.
      JWT_SECRET: ${JWT_SECRET:-local-development-signing-key-not-a-secret}
      # The fake provider locally, so `make up` reaches no network and spends none of the 800
      # daily requests. Set it to "twelvedata" with a key to exercise the real one.
      MARKET_DATA_PROVIDER: fake
      # The entrypoint runs `alembic upgrade head` in every environment. Here it also loads the
      # demo dataset, because without data there is nothing to develop against. The
      # seed is idempotent: it runs on every `make up`.
      SEED_ON_START: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  # --- Observability ----------------------------------------------------------------------------
  # The same two services production runs, with the hardening that only makes sense there left
  # out: no sub-path, no traefik labels, no memory limits, and a password everyone knows.
  # Loki and Alloy are not here -- no panel reads them, and tailing the Docker socket is a cost
  # a laptop has no reason to pay.

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
      - --storage.tsdb.retention.size=256MB
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:13.2.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      # File by file, and not the provisioning directory: mounting it whole would bring the Loki
      # datasource too, and a datasource pointing at a service that is not running is a red that
      # means nothing.
      - ./infra/grafana/provisioning/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./infra/grafana/provisioning/dashboards/origin.yml:/etc/grafana/provisioning/dashboards/origin.yml:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  db_data:
  prometheus_data:
  grafana_data:
