[project]
name = "origin-acciones-api"
version = "0.1.0"
description = "ORIGIN Acciones — API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "structlog>=26.1.0",
    "prometheus-client>=0.21",
    "sentry-sdk[fastapi]>=2.19",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.14.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "mypy>=1.13",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --- Format and lint--------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# Three of these exist so a convention stops depending on the review of a single person.
select = ["E", "F", "I", "N", "UP", "B", "BLE", "ASYNC", "S", "A", "RUF", "D", "PLC0415"]
ignore = [
  "S101",  # assert: it is how tests are written
  "D203",  # conflicts with D211; D211 wins (no blank line before the class)
  "D213",  # conflicts with D212; D212 wins (summary on the first line)
  "D401",  # imperative mood: a style opinion, not a clarity one
  "D406", "D407", "D413",  # numpy sections: docstrings here are brief and sectionless (PY-11)
  # N818 asks every exception to end in Error. The domain ones are named for the condition
  # instead -- `raise SymbolNotFound(...)` reads as the sentence it is -- and the base class
  # that groups them, ProviderError, does carry the suffix. Django names its exceptions the
  # same way (ObjectDoesNotExist, MultipleObjectsReturned).
  "N818",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Test credentials, on purpose.
"tests/**" = ["S105", "S106"]

# --- Types--------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
# Importing from a package a name its __all__ does not declare is a type error, not
# only a convention violation.
no_implicit_reexport = true
plugins = ["pydantic.mypy"]

# --- TEST-* ------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --cov=app --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = ["app/__init__.py", "app/*/__init__.py"]
