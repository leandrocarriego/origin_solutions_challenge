# The hooks that enforce, before code leaves the machine, what CONVENTIONS.md declares to be
# verified automatically.
#
# Two decisions worth understanding:
#
# 1. ruff, mypy and pytest run as `local` hooks through `uv run`, not from ruff's own hook
#    repository. A ruff installed by pre-commit carries its own version, and the day it drifts
#    from uv.lock the hook and the project disagree about formatting: the commit passes and CI
#    fails, or the reverse. Through `uv run` there is one version, the locked one.
#
# 2. pytest-fast runs tests/unit and tests/architecture with --no-cov. Those are the tests that
#    hold the boundaries (GEN-02, PY-06, PY-08, GEN-08) and they take under a second. Coverage
#    (TEST-05) measures the whole suite, so demanding it from a subset would always be red:
#    that one belongs to CI.
#
# The `name:` of each hook is what the terminal prints, so it stays in Spanish (GEN-07).
#
# Install with:  make hooks     (or: uvx pre-commit install --install-hooks)

default_install_hook_types: [pre-commit, commit-msg]

repos:
  # --- File hygiene (GIT-04) -------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-yaml
      - id: check-json
      # SEC-01: a private key that reached the history is not removed by a later commit.
      - id: detect-private-key

  # --- Language (GEN-07) -----------------------------------------------------------------------
  - repo: local
    hooks:
      - id: comment-language
        name: comentarios en ingles (GEN-07)
        entry: scripts/check_comment_language.py
        language: script
        pass_filenames: false
        always_run: true

  # --- Commit messages (GIT-03) ----------------------------------------------------------------
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert]

  # --- Backend (GEN-01, PY-07, PY-09, and the boundaries) --------------------------------------
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format (GEN-01, PY-07)
        entry: uv run --directory backend ruff format --check app tests seed.py alembic
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false

      - id: ruff-check
        name: ruff check (GEN-01, PY-07, PY-11, ERR-01)
        entry: uv run --directory backend ruff check app tests seed.py alembic
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false

      - id: mypy
        name: mypy strict sobre app y tests (PY-09)
        entry: uv run --directory backend mypy app tests seed.py alembic
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false

      - id: pytest-fast
        name: tests de unidad y de arquitectura (GEN-02, GEN-08, PY-06, PY-08)
        entry: uv run --directory backend pytest tests/unit tests/architecture --no-cov -q
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false

  # --- Frontend (TS-01, TS-02, TS-04) ----------------------------------------------------------
  - repo: local
    hooks:
      - id: frontend-format
        name: prettier (TS-04)
        entry: npm --prefix frontend run format:check
        language: system
        files: ^frontend/
        types_or: [ts, tsx, javascript, css, json]
        pass_filenames: false

      - id: frontend-lint
        name: eslint (TS-02, TS-04)
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/
        types_or: [ts, tsx]
        pass_filenames: false

      - id: frontend-types
        name: tsc --noEmit (TS-01)
        entry: npm --prefix frontend run type-check
        language: system
        files: ^frontend/
        types_or: [ts, tsx]
        pass_filenames: false
