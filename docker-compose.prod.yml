# Deploy on a VPS shared with other projects in production.
#
# Three rules that come from that, and are not negotiable here:
#   1. No published ports on a public interface. Traefik owns :80 and :443; everything else stays
#      on internal networks. The one exception is monitoring, bound to 127.0.0.1 so it is
#      reachable only through an SSH tunnel -- the same pattern the other projects on this host
#      already use, and not an opening to the internet.
#   2. Every container has a memory limit. A runaway process must not take the box down with it.
#   3. A distinct project name, so compose never touches another project's containers.
name: origin-solutions-challenge

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: origin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: origin
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U origin -d origin"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    image: origin-solutions-challenge-backend:${VERSION:-latest}
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://origin:${POSTGRES_PASSWORD}@db:5432/origin
      CORS_ORIGINS: '["https://${DOMAIN}"]'
      VERSION: ${VERSION:-latest}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: production
      # Empty is allowed while phase 0 only serves health. The quotes module reads it and
      # will fail loudly the moment it needs the provider, which is the right place to notice.
      TWELVEDATA_API_KEY: ${TWELVEDATA_API_KEY:-}
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    image: origin-solutions-challenge-frontend:${VERSION:-latest}
    build:
      context: ./frontend
    restart: unless-stopped
    networks:
      - internal
      - traefik
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 128M
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik
      # HTTPS only; the http router exists to send everyone to it.
      traefik.http.routers.origin-challenge.rule: Host(`${DOMAIN}`)
      traefik.http.routers.origin-challenge.entrypoints: websecure
      traefik.http.routers.origin-challenge.tls: "true"
      traefik.http.routers.origin-challenge.tls.certresolver: cloudflare
      traefik.http.routers.origin-challenge-http.rule: Host(`${DOMAIN}`)
      traefik.http.routers.origin-challenge-http.entrypoints: web
      traefik.http.routers.origin-challenge-http.middlewares: origin-challenge-https
      traefik.http.middlewares.origin-challenge-https.redirectscheme.scheme: https
      traefik.http.middlewares.origin-challenge-https.redirectscheme.permanent: "true"
      traefik.http.services.origin-challenge.loadbalancer.server.port: "80"

  # --- Observabilidad, capa 3 (ADR-009) --------------------------------------------------------
  # Grafana es publico y tiene login. Prometheus NO: no tiene ninguna clase de autenticacion,
  # asi que publicarlo seria publicar cada metrica y cada nombre de simbolo observado a quien
  # pase. Se queda en loopback y se llega por `ssh -L 9090:127.0.0.1:9090 mendri`.

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Bounded on both axes: a metrics database that can fill the disk of a shared VPS is a
      # way of taking the box down slowly.
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=512MB
      - --web.enable-lifecycle
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - internal
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M

  # Grafana SI sale a internet, en https://<dominio>/grafana, detras de su propio login.
  # Va por path y no por subdominio porque mendrisoftware.com no tiene DNS wildcard: un
  # `grafana.` necesitaria un registro en Cloudflare que este deploy no puede crear.
  #
  # Version: se sigue la ultima estable. Un Grafana publico varias versiones atras es una
  # lista publica de vulnerabilidades conocidas con una URL al lado.
  grafana:
    image: grafana/grafana:13.2.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      # Grafana tiene que saber bajo que URL lo ven, o los redirects del login apuntan a /.
      GF_SERVER_ROOT_URL: https://${DOMAIN}/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Nadie se registra, nadie crea organizaciones, nadie edita nada.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_USERS_VIEWERS_CAN_EDIT: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # De aca para abajo, todo es porque esta expuesto a internet.
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: lax
      GF_SECURITY_STRICT_TRANSPORT_SECURITY: "true"
      GF_SECURITY_STRICT_TRANSPORT_SECURITY_MAX_AGE_SECONDS: "31536000"
      GF_SECURITY_CONTENT_SECURITY_POLICY: "true"
      GF_SECURITY_X_CONTENT_TYPE_OPTIONS: "true"
      GF_SECURITY_X_XSS_PROTECTION: "true"
      # Gravatar y los snapshots publicos son dos salidas al exterior que nadie pidio.
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      # Grafana baja plugins de internet al arrancar (pyroscope, lokiexplore). No usamos
      # ninguno, y cada uno es codigo de terceros ejecutandose en un servicio publico.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      # Grafana es un proceso Go, y el GC de Go no sabe nada del limite del cgroup: crece
      # hasta que el kernel lo mata. Bajo una rafaga de 150 pedidos llego al 97% de 512M.
      # GOMEMLIMIT le pone la meta adentro del limite, asi el GC trabaja mas en vez de morir.
      GOMEMLIMIT: 380MiB
      # Nothing phones home: no usage reporting, no update checks, no news feed.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      # Loopback ademas del acceso publico: sirve para verificar sin salir a internet.
      - "127.0.0.1:3000:3000"
    networks:
      - internal
      - traefik
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/grafana/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          # Grafana 13 arranca en ~210 MB. Con 256 quedaba al 83% en reposo, sin margen para
          # el primer pico: se lo vio salir y reiniciar bajo una rafaga de 150 pedidos.
          memory: 512M
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik
      # Sin stripPrefix a proposito: con SERVE_FROM_SUB_PATH Grafana espera recibir /grafana.
      traefik.http.routers.origin-grafana.rule: Host(`${DOMAIN}`) && PathPrefix(`/grafana`)
      # Explicita, para no depender de que Traefik ordene por largo de regla contra el frontend.
      traefik.http.routers.origin-grafana.priority: "100"
      traefik.http.routers.origin-grafana.entrypoints: websecure
      traefik.http.routers.origin-grafana.tls: "true"
      traefik.http.routers.origin-grafana.tls.certresolver: cloudflare
      traefik.http.services.origin-grafana.loadbalancer.server.port: "3000"
      # Limite de tasa, como segunda capa. La proteccion propia de Grafana ya bloquea al
      # usuario tras 5 intentos fallidos --responde 401 generico, sin decir que esta
      # bloqueado, para no confirmar que la cuenta existe-- pero es por usuario: no frena a
      # quien escanea CVEs contra rutas que no son el login.
      #
      # sourcecriterion por CF-Connecting-IP y no por IP de origen: Cloudflare es proxy de
      # este dominio, asi que para Traefik *todos* los visitantes comparten las IPs del edge
      # de Cloudflare. Agrupar por esas IPs castigaria a usuarios legitimos en masa; el
      # header lleva la IP real del cliente.
      traefik.http.middlewares.origin-grafana-rl.ratelimit.average: "50"
      traefik.http.middlewares.origin-grafana-rl.ratelimit.burst: "100"
      traefik.http.middlewares.origin-grafana-rl.ratelimit.period: 1s
      traefik.http.middlewares.origin-grafana-rl.ratelimit.sourcecriterion.requestheadername: CF-Connecting-IP
      traefik.http.routers.origin-grafana.middlewares: origin-grafana-rl

networks:
  internal:
  traefik:
    external: true

volumes:
  db_data:
  prometheus_data:
  grafana_data:
