# The three SLOs of the service, as code.
#
# An SLO is a target on a number the system already emits, and these three are not a checklist
# copied from a manual: the first two are what makes the chart feel alive and what says the API is
# healthy, and the third is the one only this project has -- the quota. A service can be at 100%
# availability and still be useless at 16:00 because the 800 daily credits ran out at noon, and no
# generic SLO catches that. It is Article II written as an operational objective instead of as a
# principle.
#
# There is no SLA here, and that is deliberate: an SLA is a contract with a customer, with money
# attached to breaking it. There is no customer paying for this, so writing one would be inventing
# an agreement nobody signed.
#
# Each rule is one query and one threshold. `noDataState: OK` throughout, because on this service
# no data means no traffic, and no traffic is not a violation -- an alert that fires when nobody is
# using the application is an alert people learn to ignore.

apiVersion: 1

groups:
  - orgId: 1
    name: SLOs
    folder: SLOs
    interval: 1m
    rules:
      # --- Latency ------------------------------------------------------------------------------
      - uid: slo-quotes-latency
        title: SLO - el p95 de /api/quotes se mantiene bajo 300 ms
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          slo: latencia
          severity: warning
        annotations:
          summary: >-
            El p95 de la ruta que dibuja el gráfico superó los 300 ms durante 5 minutos. Es la
            ruta que decide si la pantalla se siente viva: por encima de ese número el refresco
            automático se nota como una espera.
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: origin-prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: >-
                histogram_quantile(0.95, sum by (le) (rate(
                  http_request_duration_seconds_bucket{route=~"/api/quotes.*"}[30m]
                )))
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.3]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                    params: []
                  type: query

      # --- Errors -------------------------------------------------------------------------------
      - uid: slo-error-rate
        title: SLO - menos del 1% de las respuestas son 5xx
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          slo: errores
          severity: critical
        annotations:
          summary: >-
            Más del 1% de las respuestas de la API fueron 5xx durante 5 minutos. Un 5xx es la
            aplicación fallando, no el usuario equivocándose: un 401 o un 404 no cuentan acá.
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: origin-prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: >-
                sum(rate(http_requests_total{status=~"5.."}[30m]))
                / clamp_min(sum(rate(http_requests_total[30m])), 0.001)
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.01]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                    params: []
                  type: query

      # --- Quota --------------------------------------------------------------------------------
      - uid: slo-quota-remaining
        title: SLO - queda cuota del proveedor para terminar la rueda
        condition: B
        for: 10m
        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          slo: cuota
          severity: critical
        annotations:
          summary: >-
            Quedan menos de 100 créditos de los 800 diarios. Con la cuota agotada el servicio
            sigue respondiendo --sirve lo que tiene en la base-- pero deja de incorporar
            cotizaciones nuevas, que es una forma de estar caído que ningún check de salud ve.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: origin-prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: provider_quota_remaining
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [100]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                    params: []
                  type: query
