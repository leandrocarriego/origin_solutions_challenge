# This file is copied to /etc/nginx/conf.d/default.conf, so its top level is the http context
# and a map here is valid.

# The client's real address. In production Cloudflare proxies the domain, so every visitor
# reaches this proxy from a Cloudflare edge IP and the only thing that carries the real one is
# CF-Connecting-IP -- the same criterion docker-compose.prod.yml uses for Grafana's rate limit,
# and for the same reason. Without that proxy in front, nobody sets the header and $remote_addr
# is already the client.
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# The bundle is content-hashed by Vite, so it can be cached hard. index.html cannot: it is
# what points at the current hashes, and a stale one serves a build that no longer exists.
#
# This is a map rather than an add_header per location because in nginx an add_header inside a
# location discards every header inherited from the server -- the security headers below
# included. Keeping caching and security in a single add_header block at the server level is
# the only shape where nothing gets silently dropped. try_files rewrites / to /index.html
# internally, so that request matches the default and gets no-cache, which is what it needs.
map $uri $cache_control {
    default    "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The only add_header in this file: one inside a location would drop the rest. `always` so
    # they are set on error responses too -- a 404 or a 500 still renders in the browser.
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # A missing hashed bundle is a broken deploy, not a route: answer 404 instead of letting the
    # SPA fallback below hand back index.html as if it were JavaScript. No add_header here -- one
    # inside a location would discard every header set at the server level.
    location /assets/ {
        try_files $uri =404;
    }

    # Single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The browser never learns the provider's domain (Article I). It does not learn the API's
    # either: same origin, and Traefik is what splits /api off to the backend.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # Rewritten, never appended: $proxy_add_x_forwarded_for keeps whatever the client sent,
        # and a client that writes its own X-Forwarded-For picks its own address. This proxy is
        # the only thing that knows who is talking to it, so it states it and nothing else.
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # Not exposed: /metrics has no auth and names symbols (ADR-009).
    location /metrics {
        return 404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
